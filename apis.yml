description: 'Busy Ming Group (Hunan Mingming Busy Commercial Chain Co., Ltd. / 湖南鸣鸣很忙商业连锁股份有限公司)
  is a mass-market snack retail chain operator headquartered in Changsha, Hunan, China,
  and a consumer-sector portfolio company of HongShan (formerly Sequoia Capital China).
  It operates two discount snack store brands — Snacks Are Busy (零食很忙, founded 2017)
  and Zhao Yiming Snacks (赵一鸣零食, founded 2019) — which combined into a network of more
  than 21,000 retail locations, heavily concentrated in county-level cities and townships.
  The group publishes no public developer API; this profile captures the company''s
  corporate, franchising, and investor-relations web presence.'
